# Reusable. Keeps issue status in step with pull requests; see WORKFLOW.md.
# It never closes an issue. The caller declares the triggers and permissions
# (templates/workflows/tracker.yml).
name: tracker

on:
  workflow_call:

jobs:
  tracker:
    # Pull requests from forks get a read-only token and cannot change labels.
    if: github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: tracker-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Same commit as this workflow file, so tooling and workflow cannot drift.
      - name: Fetch shared tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ba6ul/.github
          ref: ${{ github.job_workflow_sha }}
          path: .central
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Install
        working-directory: .central/tools
        run: dart pub get
      - name: Update issue status
        working-directory: .central/tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: dart run bin/repotools.dart tracker
