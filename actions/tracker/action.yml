# Keeps issue status in step with pull requests; see WORKFLOW.md. Never closes
# an issue. Used as a step in the caller's job (templates/workflows/tracker.yml).
#
# A composite action rather than a reusable workflow on purpose: the runner
# downloads this whole repo at the version the caller names, and
# github.action_path points into that download, so the tooling is always the
# same version as the action. (A reusable workflow cannot discover its own ref.)
name: tracker
description: Move issues referenced by a pull request through in progress, in review and to verify.

runs:
  using: composite
  steps:
    # Installed here rather than with dart-lang/setup-dart: that action cannot be
    # nested inside a composite action (it looks for its problem-matcher file in
    # the outer action's folder and fails). The version is pinned in this one
    # place and the download is checksum-verified. Linux runners only.
    - name: Install Dart SDK
      shell: bash
      env:
        DART_VERSION: 3.8.1
      run: |
        set -euo pipefail
        base="https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
        curl -fsSL "$base" -o "$RUNNER_TEMP/dart.zip"
        expected=$(curl -fsSL "$base.sha256sum" | cut -d' ' -f1)
        echo "$expected  $RUNNER_TEMP/dart.zip" | sha256sum -c -
        unzip -q "$RUNNER_TEMP/dart.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/dart-sdk/bin" >> "$GITHUB_PATH"
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}/../../tools
      run: dart pub get
    - name: Update issue status
      shell: bash
      working-directory: ${{ github.action_path }}/../../tools
      env:
        GH_TOKEN: ${{ github.token }}
      run: dart run bin/repotools.dart tracker
